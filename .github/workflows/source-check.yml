name: Source Sanity
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  offline-source-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity project/source and offline song pack
        shell: bash
        run: |
          set -euo pipefail
          test -f ProjectSettings/ProjectVersion.txt
          test -f Assets/Scenes/NoteScriptGame.unity
          test -f Assets/Scripts/Music/NoteScriptMarkdownParser.cs
          test -f Assets/Scripts/Music/RhythmChartGenerator.cs
          test -f Assets/Scripts/Audio/MusicPlaybackEngine.cs
          test -f Assets/Scripts/Game/NoteScriptGameApp.cs
          test -f Assets/Editor/ProjectSetup.cs
          count="$(find Assets/StreamingAssets/Songs -maxdepth 1 -type f -name '*.md' | wc -l)"
          test "$count" -ge 21
          if grep -R -E 'HttpClient|Process[.]Start|node[.]exe|127[.]0[.]0[.]1:19427' Assets/Scripts; then
            echo "Unexpected old-runtime integration in Unity code" >&2
            exit 1
          fi
          echo "PASS: Unity source and $count offline .md songs present. This is NOT a Unity compilation test."
